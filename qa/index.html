<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>橙姑娘客服 QA 查詢</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f4f0; --panel:#ffffff; --ink:#2a2420; --muted:#7a6f66; --line:#e6ded5;
  --accent:#e8711c; --accent-soft:#fdeedf; --note:#fff6d6; --note-ink:#7a5a00; --note-line:#e9cf72;
  --bubble:#eef6ea; --bubble-line:#cfe3c4; --ok:#2f7d32;
  --display:"Noto Serif TC","Songti TC",serif; --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1b1815; --panel:#24201c; --ink:#efe8e1; --muted:#a69a8f; --line:#3a332d;
  --accent:#f2893a; --accent-soft:#3a2a1c; --note:#3a3220; --note-ink:#f0d68a; --note-line:#6b5a2a;
  --bubble:#1f2b1d; --bubble-line:#35492f; --ok:#7cc47f; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#1b1815; --panel:#24201c; --ink:#efe8e1; --muted:#a69a8f; --line:#3a332d;
  --accent:#f2893a; --accent-soft:#3a2a1c; --note:#3a3220; --note-ink:#f0d68a; --note-line:#6b5a2a;
  --bubble:#1f2b1d; --bubble-line:#35492f; --ok:#7cc47f; color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.65 var(--body)}
.app{display:grid;grid-template-columns:240px 1fr;height:100%}
aside{border-right:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:18px 12px}
aside h1{font:700 19px/1.3 var(--display);margin:0 8px 4px;text-wrap:balance}
aside .sub{color:var(--muted);font-size:12px;margin:0 8px 14px}
.plist{display:flex;flex-direction:column;gap:2px}
.pbtn{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;font-size:14px}
.pbtn:hover{background:var(--accent-soft)}
.pbtn:focus-visible{outline:2px solid var(--accent)}
.pbtn[aria-current="true"]{background:var(--accent);color:#fff}
.pbtn .n{font-size:12px;opacity:.7;font-variant-numeric:tabular-nums}
.tag{white-space:nowrap;flex-shrink:0;font-size:11px;border:1px solid currentColor;border-radius:4px;padding:0 4px;opacity:.85}
main{overflow-y:auto;padding:20px clamp(16px,3vw,40px) 60px}
.bar{position:sticky;top:-20px;background:var(--bg);padding:20px 0 12px;margin-top:-20px;z-index:2;display:flex;flex-direction:column;gap:10px}
.search{display:flex;gap:8px}
.search input{flex:1;font:inherit;font-size:16px;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink)}
.search input:focus{outline:none;border-color:var(--accent)}
.search button{font:inherit;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.chip:hover,.chip:focus-visible{border-color:var(--accent);outline:none}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.status{color:var(--muted);font-size:13px}
.mobile-select{display:none}
.cards{display:flex;flex-direction:column;gap:14px;max-width:780px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.card header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
.card h2{font-size:16px;font-weight:700;margin:0;text-wrap:balance}
.card .prod{display:inline-block;font-size:12px;color:var(--accent);font-weight:500;margin-bottom:2px}
.segs{display:flex;flex-direction:column;gap:8px}
.msg{position:relative;background:var(--bubble);border:1px solid var(--bubble-line);border-radius:12px 12px 12px 4px;padding:10px 12px 10px 14px;white-space:pre-wrap;word-break:break-word;max-width:62ch}
.msg .idx{position:absolute;left:-9px;top:-9px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.msg .cp{float:right;margin:-4px -4px 4px 10px}
.note{background:var(--note);color:var(--note-ink);border:1px dashed var(--note-line);border-radius:8px;padding:6px 10px;font-size:13px;max-width:62ch}
.note::before{content:"內部提醒　";font-weight:700}
.btn{font:inherit;font-size:12.5px;padding:4px 10px;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover,.btn:focus-visible{border-color:var(--accent);color:var(--accent);outline:none}
.btn.done{color:var(--ok);border-color:var(--ok)}
mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 1px;box-shadow:0 0 0 1px var(--accent) inset}
.empty{color:var(--muted);padding:30px 0}
kbd{font:12px var(--body);border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--panel)}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  aside{display:none}
  .mobile-select{display:block}
  .mobile-select select{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
  .msg{max-width:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.login{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:10}
.login form{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px;width:min(360px,calc(100% - 32px));display:flex;flex-direction:column;gap:12px}
.login h1{font:700 20px/1.3 var(--display);margin:0}
.login input{font:inherit;font-size:16px;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.login input:focus{outline:none;border-color:var(--accent)}
.login button{font:inherit;font-weight:700;padding:11px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
.login .err{color:#c0392b;font-size:13px;min-height:1em}
.logout{all:unset;cursor:pointer;color:var(--muted);font-size:12px;margin:0 8px 12px;text-decoration:underline}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="login" id="login">
  <form id="lf">
    <h1>橙姑娘客服 QA</h1>
    <label for="pw" class="status">請輸入查詢密碼</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button type="submit" id="lb">進入</button>
    <div class="err" id="err"></div>
  </form>
</div>
<div class="app">
  <aside>
    <h1>橙姑娘客服 QA</h1>
    <p class="sub" id="meta"></p>
    <button class="logout" id="logout" type="button">登出</button>
    <div class="plist" id="plist" role="list"></div>
  </aside>
  <main>
    <div class="bar">
      <div class="mobile-select"><label for="psel" class="status">商品</label><select id="psel"></select></div>
      <div class="search">
        <input id="q" type="search" placeholder="輸入關鍵字搜尋全部商品，例如：便秘、孕婦、退費、素食" autocomplete="off" aria-label="搜尋 QA">
        <button id="clear" type="button">清除</button>
      </div>
      <div class="chips" id="chips" aria-label="常用問題"></div>
      <div class="status" id="status"></div>
    </div>
    <div class="cards" id="cards"></div>
  </main>
</div>
<script>
let DATA = [];
const KEEP_PREFIX = ["（一次食用不須分餐","(補充蛋白質食物"];
function isNote(s){
  if(KEEP_PREFIX.some(k=>s.startsWith(k))) return false;
  return /^[-–]{3,}/.test(s) || /^[（(].*[）)]$/.test(s) || /-{4,}$/.test(s) || s.startsWith("##") || s.startsWith("中間回答客人疑慮");
}
function parseAnswer(a){
  a = a.split(String.fromCharCode(0x2028)).join("\n").split(String.fromCharCode(0x3000)).join(" ");
  const segs=[]; let cur=[];
  const flush=()=>{ const v=cur.join("\n").replace(/\n{3,}/g,"\n\n").trim(); if(v) segs.push({k:"m",v}); cur=[]; };
  a.split("\n").forEach(ln=>{
    const s=ln.trim();
    if(/^-{2,}\s*分段發?\s*-+$/.test(s)){ flush(); return; }
    if(isNote(s)){ flush(); segs.push({k:"n",v:s.replace(/^##/,"").replace(/^[-–]+|[-–]+$/g,"").trim().replace(/^[（(]|[）)]$/g,"").trim()}); return; }
    cur.push(s.startsWith("回覆：")?s.slice(3):ln.replace(/\s+$/,""));
  });
  flush();
  const last=segs[segs.length-1]; if(last&&last.k==="m") last.v=last.v.replace(/"+$/,"");
  return segs;
}
const SYN = {"拉肚子":"腹瀉","肚子痛":"腹瀉","懷孕":"孕婦","哺乳":"孕婦","備孕":"孕婦","吃法":"怎麼吃","用法":"怎麼吃","幾粒":"怎麼吃","退款":"退費","退錢":"退費","無效":"退費","無感":"退費","吃素":"素食","素":"素食","月經":"生理期","大姨媽":"生理期","心悸":"心跳","失眠":"睡不著","喝酒":"飲酒","酒":"飲酒","停滯期":"停滯","過敏":"過敏","多少錢":"規格","容量":"規格","幾包":"規格","藥":"藥物"};
const CHIPS = ["怎麼吃","注意事項","素食","規格","退費","孕婦","過敏","藥物","生理期","便秘","停滯"];
let products = [];
const count = p => DATA.filter(d=>d.p===p).length;
const hasRefund = p => DATA.some(d=>d.p===p && /退費/.test(d.q));
const $ = id => document.getElementById(id);
let current = "", query = "";

function renderList(){
  $("plist").innerHTML = "";
  products.forEach(p=>{
    const b = document.createElement("button");
    b.className="pbtn"; b.type="button"; b.setAttribute("role","listitem");
    b.setAttribute("aria-current", String(!query && p===current));
    b.innerHTML = `<span>${esc(p)}</span><span style="display:flex;gap:6px;align-items:center">${hasRefund(p)?'<span class="tag">無感</span>':''}<span class="n">${count(p)}</span></span>`;
    b.onclick=()=>{ current=p; query=""; $("q").value=""; save(); render(); };
    $("plist").appendChild(b);
  });
  $("psel").innerHTML = products.map(p=>`<option ${p===current?"selected":""}>${esc(p)}</option>`).join("");
}
$("psel").onchange=e=>{ current=e.target.value; query=""; $("q").value=""; save(); render(); };
function save(){ try{localStorage.setItem("qa-product",current);}catch(e){} }
function esc(s){ return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function terms(){
  return query.split(/\s+/).filter(Boolean).map(t=>[t, SYN[t]].filter(Boolean));
}
function hl(text, ts){
  let h = esc(text);
  const words = [...new Set(ts.flat())].filter(w=>w.length).sort((a,b)=>b.length-a.length);
  if(!words.length) return h;
  const re = new RegExp("(" + words.map(w=>esc(w).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|") + ")","g");
  return h.replace(re,"<mark>$1</mark>");
}
function score(d, ts){
  const all = d.p+" "+d.q+" "+d.s.map(x=>x.v).join(" ");
  let sc=0;
  for(const group of ts){
    const hit = group.some(w=>all.includes(w));
    if(!hit) return -1;
    if(group.some(w=>d.q.includes(w))) sc+=5;
    if(group.some(w=>d.p.includes(w))) sc+=3;
    sc+=1;
  }
  return sc;
}
function copy(text, btn){
  const ok=()=>{ const o=btn.textContent; btn.textContent="已複製"; btn.classList.add("done"); setTimeout(()=>{btn.textContent=o;btn.classList.remove("done")},1400); };
  const fallback=()=>{ const t=document.createElement("textarea"); t.value=text; document.body.appendChild(t); t.select(); try{document.execCommand("copy"); ok();}catch(e){ btn.textContent="請手動選取"; } t.remove(); };
  try{ navigator.clipboard.writeText(text).then(ok, fallback); }catch(e){ fallback(); }
}
function card(d, ts, showProd){
  const el=document.createElement("article"); el.className="card";
  const msgs = d.s.filter(x=>x.k==="m");
  el.innerHTML = `<header><div>${showProd?`<span class="prod">${esc(d.p)}</span>`:""}<h2>${hl(d.q,ts)}</h2></div>${msgs.length>1?'<button class="btn all" type="button">全部複製（不含提醒）</button>':''}</header><div class="segs"></div>`;
  const box = el.querySelector(".segs"); let i=0;
  d.s.forEach(x=>{
    if(x.k==="n"){ const n=document.createElement("div"); n.className="note"; n.innerHTML=hl(x.v,ts); box.appendChild(n); return; }
    i++;
    const m=document.createElement("div"); m.className="msg";
    m.innerHTML = (msgs.length>1?`<span class="idx">${i}</span>`:"") + `<button class="btn cp" type="button">複製${msgs.length>1?"第"+i+"段":""}</button>` + hl(x.v,ts);
    m.querySelector(".cp").onclick=e=>copy(x.v,e.currentTarget);
    box.appendChild(m);
  });
  const all = el.querySelector(".all");
  if(all) all.onclick=e=>copy(msgs.map(x=>x.v).join("\n\n"), e.currentTarget);
  return el;
}
function renderChips(){
  $("chips").innerHTML="";
  CHIPS.forEach(c=>{
    const b=document.createElement("button"); b.type="button"; b.className="chip"; b.textContent=c;
    b.setAttribute("aria-pressed", String(query.trim()===c));
    b.onclick=()=>{ query = query.trim()===c ? "" : c; $("q").value=query; render(); };
    $("chips").appendChild(b);
  });
}
function render(){
  renderList(); renderChips();
  const box=$("cards"); box.innerHTML="";
  const ts = terms();
  if(ts.length){
    const res = DATA.map(d=>[d,score(d,ts)]).filter(x=>x[1]>=0).sort((a,b)=>b[1]-a[1]);
    $("status").textContent = `「${query.trim()}」找到 ${res.length} 則（全部商品）`;
    if(!res.length) box.innerHTML='<p class="empty">找不到相符的問答。試試更短的關鍵字，或從左側選商品瀏覽。</p>';
    res.forEach(([d])=>box.appendChild(card(d,ts,true)));
  } else {
    const list = DATA.filter(d=>d.p===current);
    $("status").innerHTML = `<b>${esc(current)}</b>・${list.length} 則問答　<span>按 <kbd>/</kbd> 直接搜尋</span>`;
    list.forEach(d=>box.appendChild(card(d,[],false)));
  }
}
let t; $("q").addEventListener("input",e=>{ clearTimeout(t); t=setTimeout(()=>{ query=e.target.value; render(); },120); });
$("clear").onclick=()=>{ query=""; $("q").value=""; render(); $("q").focus(); };
document.addEventListener("keydown",e=>{ if(e.key==="/" && document.activeElement!==$("q")){ e.preventDefault(); $("q").focus(); } });
function init(rows){
  DATA = rows.map(r=>({p:r.p,q:r.q.replace(/\n/g," / "),s:parseAnswer(r.a)}));
  products = [...new Set(DATA.map(d=>d.p))];
  current = products[0];
  try{ const s = localStorage.getItem("qa-product"); if(s && products.includes(s)) current = s; }catch(e){}
  $("meta").textContent = products.length + " 個商品・" + DATA.length + " 則問答";
  render();
}
const API = "https://script.google.com/macros/s/AKfycbyKxypJDyhIPgNpZc-XGtv6mcFonfBYzCAg4DOspgyRoE_RsClZjf2tgkHJ2Lajjyr7Tg/exec";
function load(pw){
  $("lb").disabled=true; $("err").textContent="讀取中…";
  fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({pw})})
    .then(r=>r.json())
    .then(res=>{
      $("lb").disabled=false;
      if(!res.ok){ $("err").textContent="密碼錯誤，請再試一次"; try{localStorage.removeItem("qa-pw");}catch(e){} $("login").hidden=false; return; }
      try{localStorage.setItem("qa-pw",pw);}catch(e){}
      $("err").textContent=""; $("login").hidden=true; init(res.rows);
    })
    .catch(()=>{ $("lb").disabled=false; $("err").textContent="連線失敗，請檢查網路後再試一次"; $("login").hidden=false; });
}
$("lf").addEventListener("submit",e=>{ e.preventDefault(); load($("pw").value); });
$("logout").onclick=()=>{ try{localStorage.removeItem("qa-pw");}catch(e){} location.reload(); };
let saved=""; try{ saved=localStorage.getItem("qa-pw")||""; }catch(e){}
if(saved){ $("login").hidden=true; load(saved); } else { $("pw").focus(); }
</script>
</body>
</html>
